# Test configuration for the bennu-saml-client "broken" surefire execution: saml.enabled = true
# with the IdP metadata present but an invalid SP private key. The engine boot must fail and the
# initializer must fail the deployment instead of starting a webapp whose SAML endpoints are dead.
saml.enabled = true
saml.idp.metadata = classpath:idp-metadata.xml
saml.sp.private-key = not-a-private-key
